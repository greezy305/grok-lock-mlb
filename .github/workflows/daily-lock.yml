name: Daily lock

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "30 19 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run picker
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/daily_lock.py

      - name: Commit picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks.json opens.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore: daily Hard Rock lock pass"
          git push
