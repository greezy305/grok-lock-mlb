<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GREEN" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Daily Lock Check</title>
  <style>
    :root {
      --bg: #0b0f0c; --card: #141a15; --line: #243028; --text: #e8f0e6;
      --mute: #8aa08a; --green: #7CFF6B; --red: #ff6b6b; --amber: #ffd36b; --blue: #8ec8ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    body { padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
    header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
    .brand { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--green); font-weight: 700; }
    h1 { margin: 4px 0 0; font-size: 22px; letter-spacing: -.03em; line-height: 1.15; max-width: 70%; }
    .stamp { font-size: 11px; color: var(--mute); text-align: right; white-space: nowrap; flex-shrink: 0; }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-row img.logo {
      width: 32px; height: 32px; border-radius: 8px;
      flex-shrink: 0; display: block;
      box-shadow: 0 0 0 1px #243028;
    }
    .brand-text { min-width: 0; }
    .bank {
      background: linear-gradient(180deg, #1a231b, #121812);
      border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; margin-bottom: 14px;
    }
    .bank .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
    .bank .big { font-size: 42px; font-weight: 700; letter-spacing: -.04em; margin: 4px 0 2px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; }
    .stat .m { font-size: 10px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }
    .stat .u { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .stat .s { font-size: 11px; color: var(--mute); margin-top: 2px; }
    .pos { color: var(--green); } .neg { color: var(--red); }
    .tabs { display: flex; gap: 6px; margin: 16px 0 12px; }
    .tab {
      flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--mute);
      border-radius: 999px; padding: 9px 0; font-size: 13px; font-weight: 600;
    }
    .tab.on { background: #1d2a1e; color: var(--green); border-color: #2e4a30; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
    .card.win { border-color: #2e4a30; } .card.loss { border-color: #4a2e2e; } .card.push { border-color: #3a3620; }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .game { font-size: 16px; font-weight: 700; }
    .time { font-size: 12px; color: var(--mute); }
    .note { font-size: 12px; color: var(--mute); margin-top: 6px; }
    .odds { font-size: 13px; color: var(--blue); margin-top: 4px; }
    .scoreline { font-size: 14px; font-weight: 700; margin-top: 6px; }
    .scoreline.live { color: var(--amber); }
    .scoreline.final { color: var(--green); }
    .scoreline.preview { color: var(--mute); font-weight: 600; }
    .badge { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
    .ml { background: #1c2c3a; color: var(--blue); }
    .rl { background: #2a2416; color: var(--amber); }
    .ou { background: #1b2a1c; color: var(--green); }
    .winb { background: #1b2a1c; color: var(--green); }
    .lossb { background: #2a1b1b; color: var(--red); }
    .pushb { background: #2a2416; color: var(--amber); }
    .pendb { background: #222; color: var(--mute); }
    .empty { text-align: center; color: var(--mute); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 16px; }
    .pick-side { font-size: 18px; font-weight: 700; margin: 4px 0; }
    .edge { color: var(--green); font-size: 13px; }
    .refresh {
      width: 100%; margin: 0 0 12px; border: 1px solid var(--line); background: var(--card);
      color: var(--text); border-radius: 12px; padding: 10px; font-weight: 600;
    }
    .rules { margin: 0; padding-left: 18px; }
    .rules li { margin: 0 0 10px; font-size: 13px; color: #c5d4c4; line-height: 1.4; }
    footer { margin-top: 18px; font-size: 11px; color: var(--mute); text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <img class="logo" src="./icon.png" width="32" height="32" alt="Grok-Lock" />
      <div class="brand-text">
        <div class="brand">GROK-LOCK-MLB · 2026</div>
        <h1>Daily Lock Check</h1>
      </div>
    </div>
    <div class="stamp" id="stamp">loading…</div>
  </header>

  <section class="bank">
    <div class="label">Stacked YTD · 1u = $50</div>
    <div class="big pos" id="stacked">+0.0u</div>
    <div class="note" id="bankNote">research + live paper</div>
    <div class="grid">
      <div class="stat"><div class="m">ML</div><div class="u pos" id="mlU">+0</div><div class="s" id="mlS">—</div></div>
      <div class="stat"><div class="m">RL</div><div class="u pos" id="rlU">+0</div><div class="s" id="rlS">—</div></div>
      <div class="stat"><div class="m">OU</div><div class="u pos" id="ouU">+0</div><div class="s" id="ouS">—</div></div>
    </div>
  </section>

  <button class="refresh" id="refreshBtn">Refresh picks + scores</button>

  <div class="tabs">
    <button class="tab on" data-tab="today">Picks</button>
    <button class="tab" data-tab="slate">Slate</button>
    <button class="tab" data-tab="recent">Results</button>
    <button class="tab" data-tab="rules">Rules</button>
  </div>

  <div id="today"></div>
  <div id="slate" hidden></div>
  <div id="recent" hidden></div>
  <div id="rules" hidden></div>

  <footer>
    One ticket per game per market. No parlays. No playoffs.<br />
    Cron locks at 10:30 / 2:00 / 5:45 ET. Pull to refresh after a run.
  </footer>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
    const fmtU = n => (n >= 0 ? "+" : "") + Number(n).toFixed(1) + "u";
    // Stake required to win target dollars at American odds (1u = $50)
    function stakeToWin(odds, winDollars) {
      const o = Number(odds);
      if (!Number.isFinite(o) || o === 0 || !Number.isFinite(winDollars)) return null;
      const stake = o > 0 ? winDollars * 100 / o : winDollars * Math.abs(o) / 100;
      return Math.round(stake * 100) / 100;
    }
    function fmtMoney(n) {
      if (n == null) return "—";
      return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }
    function stakeLines(p) {
      const o = p.odds;
      const half = stakeToWin(o, 25);  // win 1/2u
      const full = stakeToWin(o, 50);  // win 1u
      if (half == null || full == null) return "";
      return `<div class="note" style="margin-top:8px">Risk ${fmtMoney(half)} to win ½u · Risk ${fmtMoney(full)} to win 1u</div>`;
    }
    // "2:00 ET check · posted 1:40 PM ET" -> "2PM EST check"
    // Job labels use clock faces without AM/PM; map known windows.
    function shortCheck(check) {
      if (!check) return "";
      const s = String(check);
      // Prefer explicit AM/PM if present
      let m = s.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)\s*ET\s*check/i);
      if (m) {
        let h = parseInt(m[1], 10);
        const mins = m[2] ? parseInt(m[2], 10) : 0;
        const ap = m[3].toUpperCase();
        if (mins === 0) return h + ap + " EST check";
        return h + ":" + String(mins).padStart(2, "0") + ap + " EST check";
      }
      m = s.match(/(\d{1,2})(?::(\d{2}))?\s*ET\s*check/i);
      if (!m) return "";
      let h = parseInt(m[1], 10);
      const mins = m[2] ? parseInt(m[2], 10) : 0;
      // Known lock windows (ET): 10:30 AM, 2:00 PM, 5:45 PM
      let ap = "AM";
      if (h === 2 && mins === 0) { ap = "PM"; }
      else if (h === 5 && mins === 45) { ap = "PM"; }
      else if (h === 10 && mins === 30) { ap = "AM"; }
      else if (h >= 12) { ap = "PM"; h = h === 12 ? 12 : h - 12; }
      else if (h === 0) { h = 12; ap = "AM"; }
      // normalize hour display for PM windows already in 1-12 form
      if (h > 12) { h = h - 12; ap = "PM"; }
      if (mins === 0) return h + ap + " EST check";
      return h + ":" + String(mins).padStart(2, "0") + ap + " EST check";
    }
    function bookLabel(p) {
      const n = (p.note || p.book || "").toLowerCase();
      if (!n) return "";
      if (n.includes("hardrock") || n.includes("hard rock")) return "Hard Rock Bet";
      return p.note || p.book || "";
    }
    function show(id) {
      ["today","slate","recent","rules"].forEach(t => {
        document.getElementById(t).hidden = t !== id;
      });
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.tab));

    function isPending(p) {
      const s = (p.status || p.result || "pending").toLowerCase();
      return !(s === "win" || s === "w" || s === "loss" || s === "l" || s === "push" || s === "p");
    }
    function resultStack(p) {
      const s = (p.status || p.result || "pending").toLowerCase();
      let label = "PENDING";
      let cls = "pendb";
      if (s === "win" || s === "w") { label = "WIN"; cls = "winb"; }
      else if (s === "loss" || s === "l") { label = "LOSS"; cls = "lossb"; }
      else if (s === "push" || s === "p") { label = "PUSH"; cls = "pushb"; }
      const u = (p.pnl != null ? p.pnl : p.units);
      const uLine = (label === "PENDING")
        ? ""
        : `<div class="${(Number(u) >= 0 ? "pos" : "neg")}" style="font-size:13px;font-weight:700;text-align:right;margin-top:2px">${fmtU(u || 0)}</div>`;
      return `<div style="text-align:right"><span class="badge ${cls}">${label}</span>${uLine}</div>`;
    }
    function cardClass(p) {
      const s = (p.status || p.result || "").toLowerCase();
      if (s === "win" || s === "w") return "win";
      if (s === "loss" || s === "l") return "loss";
      if (s === "push" || s === "p") return "push";
      return "";
    }
    function locksEmptyMessage() {
      // Cron: 10:30, 14:00, 17:45 ET — after last check use final wording
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York", hour: "numeric", minute: "numeric", hour12: false
      }).formatToParts(now);
      const hour = Number(parts.find(p => p.type === "hour").value);
      const minute = Number(parts.find(p => p.type === "minute").value);
      const mins = hour * 60 + minute;
      if (mins >= 17 * 60 + 45) return "No Locks!";
      return "No Locks yet!";
    }

    // Live clock: network time (HTTP time API) with local ET fallback.
    // Browsers cannot query pool.ntp.org (NTP); worldtimeapi is the HTTP equivalent.
    let clockOffsetMs = 0; // networkNow - Date.now()
    let clockSynced = false;

    function formatStamp(dateObj) {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).formatToParts(dateObj);
      const get = t => (parts.find(p => p.type === t) || {}).value || "";
      return get("year") + "-" + get("month") + "-" + get("day") + " " + get("hour") + ":" + get("minute") + " EST";
    }

    function tickClock() {
      const now = new Date(Date.now() + clockOffsetMs);
      document.getElementById("stamp").textContent = formatStamp(now);
    }

    async function syncNetworkTime() {
      try {
        const r = await fetch(
          "https://worldtimeapi.org/api/timezone/America/New_York",
          { cache: "no-store" }
        );
        if (!r.ok) throw new Error("time http " + r.status);
        const j = await r.json();
        // unixtime is UTC seconds; datetime is ISO with offset
        const netMs = (typeof j.unixtime === "number")
          ? j.unixtime * 1000
          : Date.parse(j.datetime);
        if (!Number.isFinite(netMs)) throw new Error("bad time payload");
        clockOffsetMs = netMs - Date.now();
        clockSynced = true;
      } catch (e) {
        clockOffsetMs = 0;
        clockSynced = false;
      }
      tickClock();
    }


    // --- Live scores from MLB Stats API (no Odds API; Refresh-only) ---
    let lastPayload = null;
    let scoreMap = {}; // key: "away|home" lower -> {status, abstract, as, hs, inning}

    function normName(s) {
      return (s || "")
        .toLowerCase()
        .replace(/\./g, "")
        .replace(/\b(the)\b/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }
    function teamKey(away, home) {
      return normName(away) + "|" + normName(home);
    }
    function namesLoose(a, b) {
      const x = normName(a), y = normName(b);
      if (!x || !y) return false;
      if (x === y) return true;
      // "athletics" vs "oakland athletics", "rays" vs "tampa bay rays"
      return x.includes(y) || y.includes(x);
    }
    function findScore(away, home) {
      const exact = scoreMap[teamKey(away, home)];
      if (exact) return exact;
      for (const k of Object.keys(scoreMap)) {
        const [a, h] = k.split("|");
        if (namesLoose(a, away) && namesLoose(h, home)) return scoreMap[k];
      }
      return null;
    }
    function scoreHtml(g) {
      const sc = findScore(g.away, g.home);
      if (!sc) return "";
      const abs = (sc.abstract || "").toLowerCase();
      const st = sc.status || "";
      if (abs === "final" || /final/i.test(st)) {
        return `<div class="scoreline final">FINAL · ${sc.as}–${sc.hs}</div>`;
      }
      if (abs === "live" || /in progress|warmup|manager challenge|review/i.test(st)) {
        const inn = sc.inning ? " · " + sc.inning : "";
        return `<div class="scoreline live">LIVE${inn} · ${sc.as}–${sc.hs}</div>`;
      }
      if (abs === "preview" || /scheduled|pre-game|pregame/i.test(st)) {
        return `<div class="scoreline preview">PREGAME</div>`;
      }
      if (sc.as != null && sc.hs != null) {
        return `<div class="scoreline live">${st || "LIVE"} · ${sc.as}–${sc.hs}</div>`;
      }
      return "";
    }
    function todayEtStr() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/New_York",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date(Date.now() + clockOffsetMs));
    }
    function fmtShortDate(iso) {
      // iso YYYY-MM-DD -> "Sep 4"
      if (!iso || iso.length < 10) return "";
      const [y, m, d] = iso.split("-").map(Number);
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      if (!m || !d) return iso;
      return months[m - 1] + " " + d;
    }
    function renderSlate(slate, _scores) {
      const el = document.getElementById("slate");
      const today = todayEtStr();
      const boardDate = (lastPayload && lastPayload.slate_date) || "";

      // Stale board: job has not rolled to today yet
      if (boardDate && boardDate < today) {
        el.innerHTML =
          `<div class="empty"><strong>Yesterday's board</strong>` +
          `<div style="margin-top:8px;font-size:12px">Slate date ${boardDate}. ` +
          `Today is ${fmtShortDate(today)}. Board rolls at the next lock ` +
          `(10:30 / 2:00 / 5:45 ET).</div></div>`;
        return;
      }

      if (!slate || !slate.length) {
        el.innerHTML = `<div class="empty">No slate loaded.</div>`;
        return;
      }

      // Only show rows that match today's scoreboard (or have no score yet on today's board)
      const rows = slate.filter(g => {
        const sc = findScore(g.away, g.home);
        // If we have scores loaded, drop games that are not on today's MLB slate
        if (Object.keys(scoreMap).length) {
          return !!sc;
        }
        return true;
      });

      if (!rows.length) {
        el.innerHTML =
          `<div class="empty"><strong>No games on today's slate</strong>` +
          `<div style="margin-top:8px;font-size:12px">Pull again after the next lock pass.</div></div>`;
        return;
      }

      const dateIso = boardDate || today;
      el.innerHTML = rows.map(g => {
        const odds = [g.ml_away && (g.away + " " + g.ml_away), g.ml_home && (g.home + " " + g.ml_home)]
          .filter(Boolean).join(" · ") || "lines pending";
        const sc = findScore(g.away, g.home);
        const abs = ((sc && sc.abstract) || "").toLowerCase();
        const st = (sc && sc.status) || "";
        const finalish = sc && (abs === "final" || /final/i.test(st));
        const liveish = sc && (abs === "live" || /in progress|warmup|manager challenge|review/i.test(st));
        // Right side: start time for pregame; status cue when live/final
        let right = g.time || "";
        if (finalish) right = "Final";
        else if (liveish) right = sc.inning ? sc.inning : "Live";
        const oddsLine = finalish ? "" : `<div class="odds">${odds}</div>`;
        return `
        <div class="card">
          <div class="row">
            <div class="game">${g.away} @ ${g.home}</div>
            <div class="time">${right}</div>
          </div>
          <div class="note" style="margin-top:4px">${dateIso}</div>
          ${scoreHtml(g)}
          ${oddsLine}
        </div>`;
      }).join("");
    }
    async function fetchScores(dateStr) {
      // dateStr: YYYY-MM-DD in ET preferred
      const day = dateStr || new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
      const url = "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=" +
        encodeURIComponent(day) + "&hydrate=linescore,team";
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("mlb schedule " + r.status);
      const j = await r.json();
      const map = {};
      for (const d of (j.dates || [])) {
        for (const g of (d.games || [])) {
          const away = ((g.teams || {}).away || {}).team || {};
          const home = ((g.teams || {}).home || {}).team || {};
          const aName = away.name || away.teamName || "";
          const hName = home.name || home.teamName || "";
          const status = ((g.status || {}).detailedState) || "";
          const abstract = ((g.status || {}).abstractGameState) || "";
          const as = ((g.teams || {}).away || {}).score;
          const hs = ((g.teams || {}).home || {}).score;
          let inning = "";
          const ls = g.linescore || {};
          if (ls.currentInningOrdinal || ls.currentInning) {
            const half = (ls.inningHalf || ls.inningState || "").toString();
            const ord = ls.currentInningOrdinal || (ls.currentInning + "");
            inning = (half ? half + " " : "") + ord;
          }
          map[teamKey(aName, hName)] = {
            status, abstract,
            as: as == null ? null : as,
            hs: hs == null ? null : hs,
            inning: inning.trim()
          };
        }
      }
      scoreMap = map;
      return map;
    }

    function render(d) {
      // Top-right stamp is the live network/local clock — not picks.updated
      tickClock();
      const y = d.ytd || {};
      document.getElementById("stacked").textContent = fmtU(y.stacked_units || 0);
      document.getElementById("stacked").className = "big " + ((y.stacked_units || 0) >= 0 ? "pos" : "neg");
      document.getElementById("bankNote").textContent =
        "$" + Math.round((y.stacked_units || 0) * (d.unit_dollars || 50)).toLocaleString() +
        " paper · live " + fmtU(y.live_units || 0);
      ["ml","rl","ou"].forEach(k => {
        const row = y[k] || {units:0,bets:0,wr:0};
        const el = document.getElementById(k + "U");
        el.textContent = fmtU(row.units);
        el.className = "u " + (row.units >= 0 ? "pos" : "neg");
        document.getElementById(k + "S").textContent = row.bets + " · " + Math.round((row.wr||0)*100) + "%";
      });

      // Picks tab: only pending tickets whose date matches today ET
      // (hides overnight stale 9/02 pending after calendar flips)
      function todayEt() {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/New_York",
          year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date());
      }
      const todayStr = todayEt();
      const pending = (d.picks || []).filter(p => {
        if (!isPending(p)) return false;
        const pd = p.date || d.slate_date || "";
        return !pd || pd === todayStr;
      });
      const today = document.getElementById("today");
      if (!pending.length) {
        today.innerHTML =
          `<div class="empty"><strong>${locksEmptyMessage()}</strong>` +
          `<div style="margin-top:8px;font-size:12px">Graded tickets are on Results.</div></div>`;
      } else {
        today.innerHTML = pending.map(p => {
          const chk = shortCheck(p.check);
          const book = bookLabel(p);
          const foot = [p.time || "", chk].filter(Boolean).join(" · ");
          return `
          <div class="card">
            <div class="row">
              <span class="badge ${(p.market||"").toLowerCase()}">${p.market}</span>
              <span class="badge pendb">PENDING</span>
            </div>
            <div class="game">${p.away} @ ${p.home}</div>
            <div class="pick-side">${p.side}${book ? `<span class="note" style="font-size:12px;font-weight:400;margin-left:0.5em">${book}</span>` : ""}</div>
            <div class="edge">${p.edge || ""} · ${p.units || "1u"}</div>
            ${stakeLines(p)}
            ${foot ? `<div class="note">${foot}</div>` : ""}
          </div>`;
        }).join("");
      }

      lastPayload = d;
      renderSlate(d.slate || [], scoreMap);

      // Results tab: graded only — WIN/LOSS stacked over units
      // Hide junk/alt totals (e.g. Under 2.5 -1500) that slipped in before the line filter
      function isJunkResult(r) {
        const side = (r.side || "");
        const m = side.match(/\b(\d+(?:\.\d+)?)\b/);
        if (m && (r.market || "").toUpperCase() === "OU") {
          const line = parseFloat(m[1]);
          if (line < 5.5 || line > 14.5) return true;
        }
        if (/-[5-9]\d{2,}|-[1-9]\d{3,}/.test(side)) return true; // juice <= -500
        return false;
      }
      const recent = (d.recent || []).filter(r => !isJunkResult(r));
      document.getElementById("recent").innerHTML = recent.length ? recent.map(r => `
        <div class="card ${cardClass(r)}">
          <div class="row">
            <span class="badge ${(r.market||"").toLowerCase()}">${r.market}</span>
            ${resultStack(r)}
          </div>
          <div class="game">${r.game}</div>
          <div class="pick-side">${r.side || ""}</div>
          <div class="note">${r.date || ""}${r.final ? " · " + r.final : ""}</div>
        </div>`).join("") : `<div class="empty">No graded tickets yet. After finals, the next cron pass paints W/L here.</div>`;

      document.getElementById("rules").innerHTML = `
        <div class="card"><ol class="rules">
          ${(d.locks||[]).map(l => `<li><strong>${l.market}.</strong> ${l.rule}</li>`).join("")}
          <li>Max 1 unit per game per market. No parlays. No playoffs.</li>
          <li>Tickets freeze when first posted. Later cron runs only grade them.</li>
        </ol></div>`;
    }

    async function load() {
      const btn = document.getElementById("refreshBtn");
      const prev = btn.textContent;
      btn.textContent = "Refreshing…";
      btn.disabled = true;
      try {
        const r = await fetch("./picks.json?t=" + Date.now(), { cache: "no-store" });
        const data = await r.json();
        render(data);
        // Scores: free MLB API, never touches Odds API
        try {
          // Always score *today* ET — never re-label yesterday's board as live slate
          await fetchScores(todayEtStr());
          if (lastPayload) renderSlate(lastPayload.slate || [], scoreMap);
        } catch (se) {
          console.warn("score fetch failed", se);
        }
      } catch (e) {
        document.getElementById("today").innerHTML = `<div class="empty">Could not load picks.json</div>`;
      } finally {
        btn.textContent = prev;
        btn.disabled = false;
      }
    }
    document.getElementById("refreshBtn").onclick = load;
    syncNetworkTime();
    setInterval(tickClock, 15000);
    setInterval(syncNetworkTime, 10 * 60 * 1000);
    load();
  </script>
</body>
</html>
