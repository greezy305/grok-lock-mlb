name: Daily lock

on:
  schedule:
    - cron: "30 14 * * *"  # 10:30 AM ET (EDT)
    - cron: "0 18 * * *"   # 2:00 PM ET
    - cron: "45 21 * * *"  # 5:45 PM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      # Default GITHUB_TOKEN is enough for a public repo with contents: write.
      # PAGES_PUSH was failing checkout (empty/expired PAT).
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run picker
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/daily_lock.py

      - name: Commit picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks.json opens.json ledger.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore: daily Hard Rock lock pass"
          git push
