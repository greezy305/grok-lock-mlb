name: Daily lock

on:
  schedule:
    - cron: "30 14 * * *"  # 10:30 AM ET (EDT)
    - cron: "0 18 * * *"   # 2:00 PM ET
    - cron: "30 21 * * *"  # 5:30 PM ET (EDT)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test ntfy push even with 0 new tickets"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run picker
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 scripts/daily_lock.py

      - name: Commit picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks.json opens.json ledger.json lock_plan.json notify.json || true
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "chore: daily Hard Rock lock pass"
          git push

      - name: Push notify (new tickets or test)
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TEST_NOTIFY: ${{ github.event.inputs.test_notify || 'false' }}
        run: |
          set -e
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::NTFY_TOPIC secret not set — skip push"
            echo "Create a secret named NTFY_TOPIC = your topic string (e.g. grok-lock-mlb-yourname)"
            exit 0
          fi
          echo "topic_set yes"
          echo "topic_len ${#NTFY_TOPIC}"
          echo "token_set $([ -n "$NTFY_TOKEN" ] && echo yes || echo no)"

          NEW=0
          PO_NEW=0
          BODY="Grok-Lock check finished"
          TITLE="Grok-Lock"
          TAGS="baseball,moneybag"
          if [ -f notify.json ]; then
            cat notify.json
            NEW=$(python3 -c "import json; print(int(json.load(open('notify.json')).get('new_tickets') or 0))")
            PO_NEW=$(python3 -c "import json; print(int(json.load(open('notify.json')).get('new_playoff_tickets') or 0))")
            BODY=$(python3 -c "import json;d=json.load(open('notify.json'));titles=d.get('titles') or [];day=d.get('day') or '';n=int(d.get('new_tickets') or 0);pt=int(d.get('picks_today') or 0);phase=d.get('phase') or '';lines=(['%s new lock(s) · %s · %s' % (n, day, phase)] + [str(t) for t in titles[:5]]) if n else ['No new locks · %s open today · %s' % (pt, day)];print(chr(10).join(lines)[:900])")
            TITLE=$(python3 -c "import json; d=json.load(open('notify.json')); n=int(d.get('new_tickets') or 0); po=int(d.get('new_playoff_tickets') or 0); print(('Grok-Lock PS +%s' % n) if po else (('Grok-Lock +%s pick(s)' % n) if n else 'Grok-Lock'))")
            if [ "$PO_NEW" != "0" ]; then TAGS="baseball,trophy,moneybag"; fi
          else
            echo "no notify.json"
          fi
          echo "new_tickets=$NEW playoff_new=$PO_NEW test=$TEST_NOTIFY"

          # GHA boolean inputs can be True/true
          TEST_LC=$(echo "$TEST_NOTIFY" | tr '[:upper:]' '[:lower:]')
          if [ "$NEW" = "0" ] && [ "$TEST_LC" != "true" ]; then
            echo "No new tickets — no push (Actions → Daily lock → Run workflow → test_notify)"
            exit 0
          fi

          AUTH_ARGS=()
          if [ -n "$NTFY_TOKEN" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $NTFY_TOKEN")
          fi

          CODE=$(curl -sS -o /tmp/ntfy_out.txt -w "%{http_code}" \
               -H "Title: $TITLE" \
               -H "Priority: high" \
               -H "Tags: $TAGS" \
               -H "Click: https://greezy305.github.io/grok-lock-mlb/" \
               "${AUTH_ARGS[@]}" \
               -d "$BODY" \
               "https://ntfy.sh/${NTFY_TOPIC}")
          echo "ntfy_http=$CODE"
          cat /tmp/ntfy_out.txt || true
          if [ "$CODE" != "200" ]; then
            echo "::error::ntfy push failed with HTTP $CODE"
            exit 1
          fi
          echo "ntfy sent ok"
